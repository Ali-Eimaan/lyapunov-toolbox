[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyapunov-toolbox"
version = "0.1.0"
description = "Python front end for SOS Lyapunov synthesis and region-of-attraction estimation (Julia backend)."
# No `readme` / `license = {file = ...}` key: the README and LICENSE live one
# level up, and setuptools refuses to package a file outside the project
# directory. Do not "fix" this by pointing at ../README.md -- it breaks
# `pip install -e python/`. The SPDX text below is the licence of record; the
# full text is in ../LICENSE.
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ali-Eiman" }]
keywords = ["lyapunov", "sum-of-squares", "region-of-attraction", "control-theory", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Julia",
    "Topic :: Scientific/Engineering",
]

# The heavy lifting is in Julia. The Python side is a bridge plus plotting, and
# its dependency list is kept deliberately short so that importing it from the
# other portfolio repositories costs nothing.
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "juliacall>=0.9.20",
]

[project.optional-dependencies]
# PyJulia is the backend named in the repository specification. juliacall is the
# default because it manages its own libjulia and does not require the
# python-jl launcher on statically linked CPython, which is the usual reason a
# PyJulia bridge "works on my machine" only. Both are supported; see
# IMPLEMENTATION_GUIDE.md §6.1.
pyjulia = ["julia>=0.6.2"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "nbmake>=1.5",
    "jupyter>=1.0",
    # Example notebooks (run via nbmake) use scipy for linearisation analysis.
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/Ali-Eiman/lyapunov-toolbox"
Repository = "https://github.com/Ali-Eiman/lyapunov-toolbox"

[tool.setuptools.packages.find]
where = ["."]
include = ["lyapunov_toolbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "julia: requires a working Julia installation and an instantiated julia/ project",
    "slow: takes more than ~10 s",
]

[tool.coverage.run]
source = ["lyapunov_toolbox"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
